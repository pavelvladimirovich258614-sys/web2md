    <text x="46" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="url(#accent)" filter="url(#glow)">2md</text>
  </g>

  <text x="172" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#f8fafc">web2md</text>
  <text x="172" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">Web &#8594; clean Markdown &#183; for humans, RAG &amp; AI agents</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <g transform="translate(56,160)">
